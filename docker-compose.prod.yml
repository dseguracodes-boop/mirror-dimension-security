services:
  mirror-shield:
    build: .
    container_name: dimension-espejo-shield
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./evidence_vault:/app/evidence_vault
      - ./config:/app/config:ro
    command: ["daemon", "start", "--port", "8080", "--host", "0.0.0.0"]
