[project]
name = "dimension-espejo"
version = "0.1.0"
description = "Dimensión Espejo: Developer Shield de ciberresiliencia activa, decepción y entornos espejo"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dimensión Espejo Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "docker>=7.1.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
espejo = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "adapters*", "deception*", "mirror*", "isolation*", "evidence*", "recovery*", "cli*", "lab*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
