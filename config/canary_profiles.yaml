    - name: "decoy_env_aws"
      relative_path: ".env.backup"
      content_template: |
        # Development configuration
        DATABASE_URL=postgres://canary_admin:canary_trap_password_99@localhost:5432/main_db
        AWS_ACCESS_KEY_ID=CANARY_AWS_ACCESS_KEY_TRAP_01
        AWS_SECRET_ACCESS_KEY=CANARY_AWS_SECRET_KEY_TRAP_REDACTED
        JWT_SECRET=super_secret_dev_signing_key_4412
      trap_type: "filesystem_canary"

  canary_ports:
